services:
  ai-image-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-image-lab:cuda
    container_name: ai-image-lab-cuda
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ..:/workspace
    working_dir: /workspace
    ipc: host
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
