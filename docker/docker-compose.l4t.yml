services:
  ai-image-lab:
    build:
      context: .
      dockerfile: Dockerfile.l4t
    image: ai-image-lab:l4t
    container_name: ai-image-lab-l4t
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ..:/workspace
    working_dir: /workspace
    ipc: host
    shm_size: "8gb"
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
