services:
  ai-image-lab:
    build:
      context: .
      dockerfile: Dockerfile.l4t
    image: ai-image-lab:l4t
    container_name: ai-image-lab-l4t
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
      - "${TENSORBOARD_PORT:-6006}:6006"
    volumes:
      - ..:/workspace
    working_dir: /workspace
    ipc: host
    shm_size: "8gb"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TENSORBOARD_LOGDIR=/workspace/ai-image-lab-work/output/folder_lora_train/logs
      - TENSORBOARD_PORT=6006
      # Pass through only when it exists in the host environment.
      - HF_TOKEN
