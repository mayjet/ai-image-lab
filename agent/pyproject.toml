[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-agent"
version = "0.1.0"
description = "LoRA-free local image generation agent using FLUX.2/3 and Qwen VLM"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11,<3",
    "langgraph>=0.4,<1",
    "pyyaml>=6.0,<7",
    "pillow>=11.2,<12",
    "rich>=14,<15",
    "tqdm>=4.67,<5",
    "requests>=2.32,<3",
    "httpx>=0.27,<1",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
inference = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "transformers>=4.57,<6",
    "diffusers>=0.37,<1",
    "accelerate>=1.10,<2",
    "bitsandbytes>=0.48,<1",
    "huggingface-hub>=0.36,<2",
    "safetensors>=0.5,<1",
    "sentencepiece>=0.2,<1",
    "protobuf>=5.29,<6",
]
upscale = [
    "basicsr>=1.4.2",
    "realesrgan>=0.3,<1",
    "facexlib>=0.3,<1",
    "gfpgan>=1.3,<2",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "mypy>=1.15,<2",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = false

[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
